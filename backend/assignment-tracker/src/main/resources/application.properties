spring.application.name=assignment-tracker

# Server port (override with PORT env var in production cloud platforms)
server.port=${PORT:8081}

# ============================================================
# MongoDB Configuration
# In production, set MONGODB_URI environment variable:
#   MONGODB_URI=mongodb+srv://<user>:<password>@<cluster>.mongodb.net/klu_assignment_tracker?authSource=admin
#
# NOTE: Spring Boot 4.x uses spring.mongodb.* prefix.
# ============================================================
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/klu_assignment_tracker}
spring.mongodb.database=${MONGODB_DATABASE:klu_assignment_tracker}
spring.data.mongodb.auto-index-creation=true

# ============================================================
# JWT Security Configuration
# Set JWT_SECRET environment variable in production!
# ============================================================
app.jwt.secret=${JWT_SECRET:klu-assignment-tracker-default-secret-change-this-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CORS Configuration
# Set FRONTEND_URL environment variable in production (e.g. https://klu-tracker.vercel.app)
# Supports single URL, comma-separated URLs, or wildcard patterns.
# ============================================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ============================================================
# Spring Security
# ============================================================
spring.security.user.name=admin

# ============================================================
# Actuator endpoints
# Expose only health and info in production for monitoring.
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# Logging - never log passwords or sensitive data
# ============================================================
logging.level.com.klu.assignmenttracker=INFO
logging.level.org.springframework.security=WARN
# SECURITY: Never set java.net.http to DEBUG/TRACE — it would expose the LMS password in logs.
logging.level.jdk.internal.httpclient=WARN
logging.level.sun.net.www.http=WARN

# ============================================================
# KLU LMS (Moodle) Web Services authentication & REST API
# ============================================================
app.lms.token-url=${LMS_TOKEN_URL:https://lms.kluniversity.in/login/token.php}
app.lms.rest-url=${LMS_REST_URL:https://lms.kluniversity.in/webservice/rest/server.php}
app.lms.service=${LMS_SERVICE:moodle_mobile_app}
app.lms.timeout-seconds=${LMS_TIMEOUT_SECONDS:15}
app.lms.token-cache-ttl-minutes=${LMS_TOKEN_CACHE_TTL_MINUTES:120}

# ============================================================
# Automatic LMS Sync Scheduler
# ============================================================
app.sync.enabled=${SYNC_ENABLED:true}
app.sync.interval-minutes=${SYNC_INTERVAL_MINUTES:30}

# ============================================================
# Web Push / VAPID Configuration
# ============================================================
app.push.enabled=${PUSH_ENABLED:true}
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:klu.assignment.tracker@example.com}

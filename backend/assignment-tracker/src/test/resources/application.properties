# Test-specific property overrides.
# Spring Boot 4.x renamed the MongoDB property prefix from spring.data.mongodb.*
# to spring.mongodb.* \u2014 the old prefix is silently ignored.

# JWT - use a test-only secret
app.jwt.secret=test-secret-key-for-testing-only-must-be-long-enough
app.jwt.expiration-ms=86400000

# MongoDB - uses MONGODB_URI environment variable if present
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/klu_assignment_tracker}
spring.mongodb.database=${MONGODB_DATABASE:klu_assignment_tracker}

# KLU LMS properties — required for LmsAuthService bean initialization.
# The LMS is never actually called during tests (no real login tests run).
app.lms.token-url=https://lms.kluniversity.in/login/token.php
app.lms.service=moodle_mobile_app
app.lms.timeout-seconds=10